<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EtherFlow Pro — Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void:        #0e0818;
      --bg-panel:       #140d24;
      --bg-card:        #1a0f2e;
      --bg-input:       #120b20;
      --border:         #2a1a45;
      --border-bright:  #3d2560;
      --cyan:           #00e5e5;
      --cyan-dim:       #00b8b8;
      --cyan-glow:      rgba(0, 229, 229, 0.15);
      --teal:           #00c8c8;
      --accent:         #c9ff00;
      --accent-glow:    rgba(201, 255, 0, 0.18);
      --purple:         #6e348c;
      --purple-bright:  #8a42ad;
      --whale-red:      #e05c8c;
      --whale-orange:   #f4d0d0;
      --dolphin-yellow: #c9ff00;
      --text-primary:   #f4d0d0;
      --text-secondary: #8a6fa8;
      --text-muted:     #4a3060;
      --font-mono:      'Share Tech Mono', monospace;
      --font-display:   'Poppins', sans-serif;
      --font-data:      'Space Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: radial-gradient(ellipse at top left, #1a0f2e 0%, #0e0818 60%, #080510 100%);
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    .ef-navbar {
      background: linear-gradient(90deg, var(--bg-panel) 0%, rgba(110,52,140,0.08) 100%);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .ef-logo {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--accent-glow);
    }
    .ef-logo span { color: var(--text-secondary); font-weight: 500; }

    .ef-status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ef-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { opacity: 0.6; box-shadow: 0 0 0 4px transparent; }
    }

    .ef-main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }

    .ef-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .ef-stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--purple);
    }
    .ef-stat-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.4rem;
    }
    .ef-stat-value {
      font-family: var(--font-data);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .ef-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .ef-panel-title {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    .ef-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .ef-textarea:focus { border-color: var(--purple-bright); }

    .ef-slider-wrap { margin-top: 1rem; }
    .ef-slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .ef-slider-title {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .ef-slider-val {
      font-family: var(--font-data);
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    input[type="range"].ef-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border-bright);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].ef-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .ef-btn {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--purple);
      color: var(--accent);
      padding: 0.6rem 2rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 1rem;
    }
    .ef-btn:hover {
      color: var(--accent);
      border-color: var(--purple-bright);
      box-shadow: 0 0 20px rgba(110, 52, 140, 0.4);
      background: linear-gradient(135deg, var(--purple), var(--purple-bright));
    }
    .ef-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .ef-chart-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      min-height: 420px;
    }

    #dual-chart {
      width: 100%;
      min-height: 580px;
      display: block;
      background: rgba(0,0,0,0.2);
    }

    svg { display: block; overflow: visible; }

    .ef-coin-selector { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .ef-coin-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .ef-coin-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.18s ease;
    }
    .ef-coin-btn:hover {
      border-color: var(--purple-bright);
      background: rgba(110,52,140,0.12);
    }
    .ef-coin-btn.active {
      border-color: var(--purple);
      background: rgba(110,52,140,0.18);
    }
    .ef-coin-btn.active::before { background: var(--accent); }

    .ef-coin-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
      font-family: var(--font-data);
      flex-shrink: 0;
    }
    .ef-coin-icon.btc  { background: rgba(247,147,26,0.15); color: #f7931a; border: 1px solid rgba(247,147,26,0.3); }
    .ef-coin-icon.eth  { background: rgba(98,126,234,0.15); color: #627eea; border: 1px solid rgba(98,126,234,0.3); }
    .ef-coin-icon.sol  { background: rgba(20,241,149,0.12); color: #14f195; border: 1px solid rgba(20,241,149,0.3); }

    .ef-coin-name { font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
    .ef-coin-pair { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
    .ef-coin-badge { font-family: var(--font-mono); font-size: 0.55rem; color: var(--accent); opacity: 0; transition: opacity 0.18s; }
    .ef-coin-btn.active .ef-coin-badge { opacity: 1; }

    .ef-table-wrap { overflow-x: auto; max-height: 280px; overflow-y: auto; }
    .ef-table-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
    .ef-table-wrap::-webkit-scrollbar-track { background: transparent; }
    .ef-table-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    .ef-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.65rem; }
    .ef-table th {
      text-align: left; padding: 0.5rem 0.75rem;
      color: var(--text-secondary); border-bottom: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 400;
    }
    .ef-table td { padding: 0.45rem 0.75rem; border-bottom: 1px solid rgba(30,34,53,0.5); color: var(--text-primary); white-space: nowrap; }
    .ef-table tr:hover td { background: rgba(255,255,255,0.02); }

    .ef-alert {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      background: rgba(255, 23, 68, 0.08);
      border: 1px solid rgba(255, 23, 68, 0.3);
      color: #ff8a80;
      border-radius: 4px;
      padding: 0.6rem 0.9rem;
      margin-top: 0.75rem;
      display: none;
    }
    .ef-alert.active { display: block; }

    @media (max-width: 768px) {
      .ef-main { padding: 1rem; }
      .ef-stat-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <nav class="ef-navbar">
    <div class="ef-logo">Ether<span>Flow</span> <small style="font-size:0.55rem;font-weight:500;color:var(--purple-bright);letter-spacing:0.08em;">PRO</small></div>
    <div class="ef-status">
      <div class="ef-status-dot" id="statusDot"></div>
      <span id="connectionStatus">SYSTEM READY</span>
    </div>
  </nav>

  <div class="ef-main">
    <div class="row g-3">
      <!-- LEFT SIDEBAR -->
      <div class="col-lg-2">
        <div class="ef-stat" style="border-left:4px solid var(--purple);margin-bottom:15px;">
          <div class="ef-stat-label">Live <span id="assetLabel">BTC</span> Price</div>
          <div class="ef-stat-value" id="livePriceDisplay">$0.00</div>
        </div>

        <div class="ef-panel" style="margin-bottom:1rem;">
          <div class="ef-panel-title">// select asset</div>
          <div class="ef-coin-selector">
            <button class="ef-coin-btn active" data-symbol="BTCUSDT" onclick="selectCoin(this)">
              <div class="ef-coin-icon btc">&#8383;</div>
              <div><div class="ef-coin-name">Bitcoin</div><div class="ef-coin-pair">BTC / USDT</div></div>
              <span class="ef-coin-badge">&#9679;</span>
            </button>
            <button class="ef-coin-btn" data-symbol="ETHUSDT" onclick="selectCoin(this)">
              <div class="ef-coin-icon eth">&#926;</div>
              <div><div class="ef-coin-name">Ethereum</div><div class="ef-coin-pair">ETH / USDT</div></div>
              <span class="ef-coin-badge">&#9679;</span>
            </button>
            <button class="ef-coin-btn" data-symbol="SOLUSDT" onclick="selectCoin(this)">
              <div class="ef-coin-icon sol">&#9678;</div>
              <div><div class="ef-coin-name">Solana</div><div class="ef-coin-pair">SOL / USDT</div></div>
              <span class="ef-coin-badge">&#9679;</span>
            </button>
          </div>
        </div>

        <div class="ef-panel">
          <div class="ef-panel-title">// market config</div>
          <label class="ef-slider-title">Trading Pair</label>
          <input type="text" id="symbolInput" class="ef-textarea" style="min-height:40px;margin-bottom:10px;" value="BTCUSDT">

          <label class="ef-slider-title">Timeframe</label>
          <select id="intervalInput" class="ef-textarea" style="min-height:40px;">
            <option value="1m" selected>1 Minute</option>
            <option value="5m">5 Minutes</option>
            <option value="15m">15 Minutes</option>
            <option value="1h">1 Hour</option>
            <option value="4h">4 Hours</option>
          </select>

          <button class="ef-btn mt-3" id="startBtn">START SYNC</button>

          <div class="ef-slider-wrap mt-4">
            <div class="ef-slider-header">
              <span class="ef-slider-title">Sensitivity</span>
              <span class="ef-slider-val" id="sliderVal">5</span>
            </div>
            <input type="range" class="ef-slider" id="multiplierSlider" min="2" max="15" step="0.5" value="5">
          </div>
        </div>
      </div>

      <!-- MAIN CHART AREA -->
      <div class="col-lg-10">
        <div class="ef-chart-panel" style="height:680px;">
          <div class="ef-panel-title">
            // live hlc chart + anomaly overlay
            <span id="volatilityIndicator" style="float:right;color:var(--accent)">VOL: 0.00%</span>
          </div>
          <div id="dual-chart" style="min-height:620px;"></div>
        </div>

        <div class="ef-panel">
          <div class="ef-panel-title">// whale activity log</div>
          <div class="ef-alert" id="alertBox"></div>
          <div class="ef-table-wrap">
            <table class="ef-table">
              <thead>
                <tr><th>Time</th><th>Volume ($)</th><th>Deviation</th><th>Alert Type</th></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ── Anomaly detection (replaces PHP detect.php) ─── */
    function median(arr) {
      if (!arr.length) return 0;
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    }

    function detectAnomalies(points, multiplier) {
      const volumes = points.map(p => p.volume);
      const WINDOW = 24;
      return points.map((p, i) => {
        const start = Math.max(0, i - WINDOW);
        const windowVols = volumes.slice(start, i);
        if (!windowVols.length) windowVols.push(volumes[i]);
        const winMedian = median(windowVols);
        const ratio = winMedian > 0 ? volumes[i] / winMedian : 0;
        const isWhale = volumes[i] >= winMedian * multiplier;
        let severity = 'normal';
        if (isWhale) {
          if (ratio >= 8) severity = 'blue_whale';
          else if (ratio >= 5) severity = 'whale';
          else severity = 'dolphin';
        }
        return {
          index: i,
          timestamp: p.time,
          volume: volumes[i],
          window_median: winMedian,
          is_whale: isWhale,
          severity,
          deviation_pct: winMedian > 0 ? +(((volumes[i] - winMedian) / winMedian) * 100).toFixed(2) : 0
        };
      });
    }

    /* ── App state ──────────────────────────────────── */
    let socket = null;
    let dataPoints = [];
    const MAX_POINTS = 40;

    const startBtn = document.getElementById('startBtn');
    const multiplierSlider = document.getElementById('multiplierSlider');
    const sliderVal = document.getElementById('sliderVal');

    multiplierSlider.addEventListener('input', () => {
      sliderVal.textContent = multiplierSlider.value;
      if (dataPoints.length >= 5) analyzeAnomalies();
    });

    function selectCoin(btn) {
      document.querySelectorAll('.ef-coin-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const symbol = btn.dataset.symbol;
      document.getElementById('symbolInput').value = symbol;
      document.getElementById('assetLabel').textContent = symbol.replace('USDT', '');
    }

    /* ── Fetch Binance history ─────────────────────── */
    async function fetchHistory(symbol, interval) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=${interval}&limit=${MAX_POINTS}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code) throw new Error(data.msg);
        dataPoints = data.map(d => ({
          time: new Date(d[0]).toLocaleTimeString(),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4]),
          volume: parseFloat(d[5]) * parseFloat(d[4]),
          isClosed: true
        }));
        analyzeAnomalies();
      } catch (err) {
        console.error("History fetch failed:", err);
        document.getElementById('connectionStatus').textContent = 'FETCH ERROR';
      }
    }

    /* ── WebSocket stream ──────────────────────────── */
    function initStream() {
      const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
      const interval = document.getElementById('intervalInput').value;

      if (socket) socket.close();
      document.getElementById('assetLabel').textContent = symbol.replace('USDT', '');
      document.getElementById('connectionStatus').textContent = 'SYNCING...';
      document.getElementById('statusDot').style.background = 'var(--accent)';

      fetchHistory(symbol, interval);

      try {
        socket = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${interval}`);

        socket.onopen = () => {
          document.getElementById('connectionStatus').textContent = 'LIVE';
          document.getElementById('statusDot').style.background = '#22c55e';
        };

        socket.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          const k = msg.k;

          const currentPrice = parseFloat(k.c);
          const livePriceEl = document.getElementById('livePriceDisplay');
          livePriceEl.textContent = '$' + currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
          livePriceEl.style.color = currentPrice >= parseFloat(k.o) ? 'var(--accent)' : 'var(--whale-red)';

          const currentPoint = {
            time: new Date(k.t).toLocaleTimeString(),
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: currentPrice,
            volume: parseFloat(k.v) * currentPrice,
            isClosed: k.x
          };

          if (dataPoints.length > 0 && !dataPoints[dataPoints.length - 1].isClosed) {
            dataPoints[dataPoints.length - 1] = currentPoint;
          } else {
            dataPoints.push(currentPoint);
          }
          if (dataPoints.length > MAX_POINTS) dataPoints.shift();

          const vol = ((currentPoint.high - currentPoint.low) / currentPoint.low * 100).toFixed(2);
          document.getElementById('volatilityIndicator').textContent = `VOL: ${vol}%`;

          analyzeAnomalies();
        };

        socket.onerror = () => {
          document.getElementById('connectionStatus').textContent = 'CONNECTION ERROR';
          document.getElementById('statusDot').style.background = 'var(--whale-red)';
        };

        socket.onclose = () => {
          document.getElementById('connectionStatus').textContent = 'DISCONNECTED';
          document.getElementById('statusDot').style.background = 'var(--text-muted)';
        };
      } catch (e) {
        document.getElementById('connectionStatus').textContent = 'WEBSOCKET ERROR';
      }
    }

    /* ── Analyse + render ──────────────────────────── */
    function analyzeAnomalies() {
      if (dataPoints.length < 5) return;
      const results = detectAnomalies(dataPoints, parseFloat(multiplierSlider.value));
      renderChart(results);
    }

    function renderChart(results) {
      const container = document.getElementById('dual-chart');
      container.innerHTML = '';
      const w = container.clientWidth;
      const h = 630;
      const margin = { top: 20, right: 20, bottom: 48, left: 70 };
      const chartHeight = h - 100;

      const svg = d3.select("#dual-chart").append("svg").attr("width", w).attr("height", h);

      // Background grid
      const gridGroup = svg.append("g").attr("class", "grid");

      // X Scale
      const x = d3.scaleBand()
        .domain(d3.range(dataPoints.length))
        .range([margin.left, w - margin.right])
        .padding(0.3);

      // Price Scale
      const yPrice = d3.scaleLinear()
        .domain([d3.min(dataPoints, d => d.low) * 0.999, d3.max(dataPoints, d => d.high) * 1.001])
        .range([chartHeight * 0.7, margin.top]);

      // Volume Scale
      const yVol = d3.scaleLinear()
        .domain([0, d3.max(results, d => d.volume) * 1.1 || 1])
        .range([h - margin.bottom, chartHeight * 0.75]);

      // Horizontal grid lines for price
      const priceTicks = yPrice.ticks(6);
      priceTicks.forEach(tick => {
        gridGroup.append("line")
          .attr("x1", margin.left).attr("x2", w - margin.right)
          .attr("y1", yPrice(tick)).attr("y2", yPrice(tick))
          .attr("stroke", "var(--border)").attr("stroke-dasharray", "2 4");
        gridGroup.append("text")
          .attr("x", margin.left - 8).attr("y", yPrice(tick) + 3)
          .attr("text-anchor", "end")
          .attr("font-family", "'Share Tech Mono', monospace")
          .attr("font-size", "9px").attr("fill", "var(--text-secondary)")
          .text('$' + tick.toLocaleString(undefined, {maximumFractionDigits: 0}));
      });

      // Candlesticks
      const candles = svg.selectAll(".candle")
        .data(dataPoints).enter().append("g");

      candles.append("line")
        .attr("x1", (d, i) => x(i) + x.bandwidth() / 2)
        .attr("x2", (d, i) => x(i) + x.bandwidth() / 2)
        .attr("y1", d => yPrice(d.high))
        .attr("y2", d => yPrice(d.low))
        .attr("stroke", d => d.close >= d.open ? "var(--teal)" : "var(--whale-red)");

      candles.append("rect")
        .attr("x", (d, i) => x(i))
        .attr("y", d => yPrice(Math.max(d.open, d.close)))
        .attr("width", x.bandwidth())
        .attr("height", d => Math.max(2, Math.abs(yPrice(d.open) - yPrice(d.close))))
        .attr("fill", d => d.close >= d.open ? "var(--teal)" : "var(--whale-red)")
        .attr("opacity", 0.8);

      // Volume line
      const volumeLine = d3.line()
        .x((d, i) => x(i) + x.bandwidth() / 2)
        .y(d => yVol(d.volume))
        .curve(d3.curveMonotoneX);

      svg.append("path")
        .datum(results)
        .attr("fill", "none")
        .attr("stroke", "var(--cyan)")
        .attr("stroke-width", 1.5)
        .attr("stroke-opacity", 0.5)
        .attr("d", volumeLine);

      // Volume bubbles
      svg.selectAll(".bubble")
        .data(results).enter().append("circle")
        .attr("cx", (d, i) => x(i) + x.bandwidth() / 2)
        .attr("cy", d => yVol(d.volume))
        .attr("r", d => d.is_whale ? 12 : 4)
        .attr("fill", d => {
          if (d.severity === 'blue_whale') return 'var(--whale-orange)';
          if (d.is_whale) return 'var(--whale-red)';
          return 'var(--cyan)';
        })
        .attr("stroke", d => d.is_whale ? (d.severity === 'blue_whale' ? 'var(--whale-orange)' : 'var(--whale-red)') : 'none')
        .attr("stroke-width", d => d.is_whale ? 1.5 : 0)
        .attr("stroke-opacity", 0.4)
        .attr("opacity", d => d.is_whale ? 1 : 0.6);

      // Timestamp axis
      const tickEvery = Math.ceil(dataPoints.length / 10);
      const tickIndices = dataPoints.map((d, i) => i).filter(i => i % tickEvery === 0 || i === dataPoints.length - 1);

      svg.append("line")
        .attr("x1", margin.left).attr("x2", w - margin.right)
        .attr("y1", h - margin.bottom + 2).attr("y2", h - margin.bottom + 2)
        .attr("stroke", "var(--border-bright)").attr("stroke-width", 1);

      tickIndices.forEach(i => {
        const cx = x(i) + x.bandwidth() / 2;
        svg.append("line")
          .attr("x1", cx).attr("x2", cx)
          .attr("y1", h - margin.bottom + 2).attr("y2", h - margin.bottom + 7)
          .attr("stroke", "var(--border-bright)").attr("stroke-width", 1);
        svg.append("text")
          .attr("x", cx).attr("y", h - margin.bottom + 22)
          .attr("text-anchor", "middle")
          .attr("font-family", "'Share Tech Mono', monospace")
          .attr("font-size", "9px").attr("fill", "var(--text-secondary)")
          .attr("letter-spacing", "0.04em")
          .text(dataPoints[i].time);
      });

      updateTable(results);
    }

    function updateTable(results) {
      const whales = results.filter(r => r.is_whale).reverse();
      const tbody = document.getElementById('tableBody');
      const alertBox = document.getElementById('alertBox');

      if (whales.length > 0) {
        const latest = whales[0];
        alertBox.className = 'ef-alert active';
        alertBox.innerHTML = `⚠ <strong>${latest.severity.toUpperCase()}</strong> detected — $${Math.round(latest.volume).toLocaleString()} volume (+${latest.deviation_pct}% deviation)`;
      } else {
        alertBox.className = 'ef-alert';
      }

      tbody.innerHTML = whales.map(r => {
        const color = r.severity === 'blue_whale' ? 'var(--whale-orange)' : 'var(--whale-red)';
        const badgeClass = r.severity === 'blue_whale' ? 'badge-blue-whale' : (r.severity === 'whale' ? 'badge-whale' : 'badge-dolphin');
        return `<tr style="color:${color}">
          <td>${r.timestamp}</td>
          <td>$${Math.round(r.volume).toLocaleString()}</td>
          <td>+${r.deviation_pct}%</td>
          <td><span class="${badgeClass}">${r.severity.toUpperCase()}</span></td>
        </tr>`;
      }).join('');
    }

    startBtn.addEventListener('click', initStream);

    // Auto-start on load
    window.addEventListener('load', () => {
      setTimeout(initStream, 300);
    });
  </script>
</body>
</html>
